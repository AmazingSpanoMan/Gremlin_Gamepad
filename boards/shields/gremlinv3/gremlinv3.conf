# ==============================================================================
# Gremlin v3 Configuration
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. ZMK Studio (Live GUI Key Remapping)
# ------------------------------------------------------------------------------
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n

# ------------------------------------------------------------------------------
# 2. Display Support (Nice!View / Sharp Memory LCD via custom SPI0)
# ------------------------------------------------------------------------------
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_BUILT_IN=n
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y
CONFIG_LV_Z_MEM_POOL_SIZE=16384
CONFIG_LV_USE_CANVAS=y
CONFIG_LV_USE_IMG=y
CONFIG_LV_FONT_MONTSERRAT_12=y
CONFIG_LV_FONT_MONTSERRAT_14=y
CONFIG_LV_FONT_MONTSERRAT_16=y
CONFIG_LV_FONT_DEFAULT_MONTSERRAT_14=y
CONFIG_ZMK_WIDGET_BATTERY_STATUS=n
CONFIG_ZMK_WIDGET_BATTERY_STATUS_SHOW_PERCENTAGE=n
CONFIG_ZMK_WIDGET_OUTPUT_STATUS=n
CONFIG_ZMK_WIDGET_LAYER_STATUS=n
CONFIG_ZMK_WIDGET_WPM_STATUS=n

# ------------------------------------------------------------------------------
# 3. Analog Stick & SAADC (wdtamagi/zmk-driver-analog-stick)
# ------------------------------------------------------------------------------
CONFIG_ADC=y
CONFIG_ADC_NRFX_SAADC=y
CONFIG_ZMK_ANALOG_STICK=y
CONFIG_ZMK_MOUSE=y
CONFIG_ZMK_POINTING=y
CONFIG_INPUT=y

# ------------------------------------------------------------------------------
# 4. Bluetooth & Power Management
# ------------------------------------------------------------------------------
CONFIG_ZMK_BLE=y
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_ZMK_SLEEP=y
# Sleep timeout: 15 minutes (900,000 ms)
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000
# Idle timeout: 30 seconds (30,000 ms)
CONFIG_ZMK_IDLE_TIMEOUT=30000
CONFIG_ZMK_EXT_POWER=y
# Improve BLE connection stability with PC/Windows hosts (disables 2M PHY)
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
# Expand L2CAP/ACL TX buffers so rapid HID + battery notifications do not stall
CONFIG_BT_BUF_ACL_TX_COUNT=10
CONFIG_BT_L2CAP_TX_BUF_COUNT=10
# Prevent thread stack overflows during BLE GATT/ATT notifications & input processing
CONFIG_ZMK_BLE_THREAD_STACK_SIZE=2048
CONFIG_ZMK_LOW_PRIORITY_THREAD_STACK_SIZE=2048
CONFIG_INPUT_THREAD_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096

# ------------------------------------------------------------------------------
# 5. Optional Debugging (Uncomment to view live SAADC stick readings via USB)
#    Note: Keep disabled for ZMK Studio USB RPC transport (`studio-rpc-usb-uart`)
# ------------------------------------------------------------------------------
# CONFIG_ZMK_USB_LOGGING=y
# CONFIG_ZMK_ANALOG_STICK_LOG_LEVEL_DBG=y

# ------------------------------------------------------------------------------
# 6. Combo Limits
# ------------------------------------------------------------------------------
CONFIG_ZMK_COMBO_MAX_COMBOS_PER_KEY=16

